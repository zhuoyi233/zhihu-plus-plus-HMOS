name: Bug 反馈
description: 反馈 bug 或错误的行为。
title: "[Bug] "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: "请反馈知乎++鸿蒙版的问题，并填写实际设备、系统和应用版本；信息不足时可能需要补充说明。"

  - type: textarea
    id: description
    attributes:
      label: 描述
      description: 清晰地描述这个 bug。
      placeholder: "例如：点击首页的推荐按钮后应用崩溃，显示白屏..."
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: 发生 bug 的文章/回答链接
      description: 请粘贴出现问题的文章或回答的链接。
      placeholder: "https://www.zhihu.com/question/xxx/answer/xxx"
    validations:
      required: false

  - type: textarea
    id: reproduce
    attributes:
      label: 如何复现
      description: 详细描述如何触发这个 bug。
      placeholder: |
        1. 点击「...」
        2. 打开「...」
        3. 前往「...」
        4. 出现 bug
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期的表现
      description: 你觉得应该发生什么行为？
      placeholder: "例如：应该正常打开推荐页面..."
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图
      description: 如果有相关截图，请粘贴在这里（可选）。

  - type: input
    id: device
    attributes:
      label: 设备及型号
      placeholder: "例如：华为 Mate 系列（请填写具体型号） / HarmonyOS 手机模拟器（API 23）"
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: 操作系统版本
      description: 请填写设备实际的 HarmonyOS 版本，建议同时提供完整系统构建号。
      placeholder: "例如：HarmonyOS 6.1.0（API 23）"
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: 应用版本（知乎++鸿蒙版）
      description: 在“我的 → 关于与诊断 → 应用与版本”查看已安装版本，请同时填写版本名和版本号。
      placeholder: "例如：0.5.8（版本号 1000508）"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 其他
      description: 其他补充信息（可选）。
